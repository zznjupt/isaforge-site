<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-label="Checking a custom instruction against its sequence">
  <title>Checking a custom instruction against its sequence</title>
  <defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1F2937" flood-opacity="0.1"/></filter><marker id="ah-2F56A6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F56A6"/></marker><marker id="ah-7C5AD9" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C5AD9"/></marker></defs>
  <rect width="1040" height="470" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="30" y="40" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="20" fill="#1F2937" font-weight="700" text-anchor="start">Equivalence: the new instruction and the sequence it replaces</text>
  <rect x="330" y="64" width="380" height="56" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="520" y="88" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" fill="#1F2937" font-weight="700" text-anchor="middle">The same initial state S</text>
  <text x="520" y="108" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#6B7280" font-weight="400" text-anchor="middle">every register (random, or z3's symbols)</text>
  <rect x="726" y="79" width="208.49999999999997" height="26" rx="13.0" fill="#FFFFFF" stroke="#F28C28" stroke-width="1.4"/>
  <text x="830.25" y="96.5" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9A5000" font-weight="600" text-anchor="middle">given tmp ≠ rs1, tmp ≠ rs2</text>
  <path d="M430,122 L250,160" fill="none" stroke="#2F56A6" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-2F56A6)"/>
  <path d="M610,122 L790,160" fill="none" stroke="#7C5AD9" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-7C5AD9)"/>
  <rect x="60" y="164" width="380" height="132" rx="14" fill="#E8EEFA" stroke="#2F56A6" stroke-width="1.6" filter="url(#shadow)"/>
  <path d="M60,178 a14,14 0 0 1 14,-14 h352 a14,14 0 0 1 14,14 v28 h-380 z" fill="#2F56A6"/>
  <text x="76" y="192" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">The new instruction (1)</text>
  <rect x="80" y="218" width="340" height="40" rx="8" fill="#FFFFFF" stroke="#2F56A6" stroke-width="1.3"/>
  <text x="250" y="244" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#1F3F80" font-weight="700" text-anchor="middle">sh1add rd, rs1, rs2</text>
  <text x="250" y="282" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6B7280" font-weight="400" text-anchor="middle">rd = (rs1 &lt;&lt; 1) + rs2</text>
  <rect x="600" y="164" width="380" height="132" rx="14" fill="#F1ECFE" stroke="#7C5AD9" stroke-width="1.6" filter="url(#shadow)"/>
  <path d="M600,178 a14,14 0 0 1 14,-14 h352 a14,14 0 0 1 14,14 v28 h-380 z" fill="#7C5AD9"/>
  <text x="616" y="192" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">The base sequence (2)</text>
  <rect x="620" y="210" width="340" height="34" rx="8" fill="#FFFFFF" stroke="#7C5AD9" stroke-width="1.3"/>
  <text x="790" y="233" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4F2FA6" font-weight="700" text-anchor="middle">slli tmp, rs1, 1</text>
  <rect x="620" y="252" width="340" height="34" rx="8" fill="#FFFFFF" stroke="#7C5AD9" stroke-width="1.3"/>
  <text x="790" y="275" font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#4F2FA6" font-weight="700" text-anchor="middle">add  rd, tmp, rs2</text>
  <path d="M250,298 L250,330 L400,330" fill="none" stroke="#2F56A6" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-2F56A6)"/>
  <path d="M790,298 L790,330 L640,330" fill="none" stroke="#7C5AD9" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah-7C5AD9)"/>
  <rect x="404" y="306" width="232" height="50" rx="12" fill="#FEF1E3" stroke="#F28C28" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="520" y="329" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" fill="#9A5000" font-weight="700" text-anchor="middle">A exactly equals B?</text>
  <text x="520" y="347" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12" fill="#6B7280" font-weight="400" text-anchor="middle">every register but tmp</text>
  <text x="325" y="323" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#1F3F80" font-weight="700" text-anchor="middle">state A</text>
  <text x="715" y="323" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#4F2FA6" font-weight="700" text-anchor="middle">state B</text>
  <rect x="60" y="380" width="440" height="72" rx="14" fill="#E1F6F3" stroke="#17B3A3" stroke-width="1.6" filter="url(#shadow)"/>
  <path d="M60,394 a14,14 0 0 1 14,-14 h412 a14,14 0 0 1 14,14 v28 h-440 z" fill="#17B3A3"/>
  <text x="76" y="408" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">make equiv: differential</text>
  <text x="76" y="438" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#1F2937" font-weight="400" text-anchor="start">20 random states meeting the preconditions, run on Sail and Rust</text>
  <rect x="540" y="380" width="440" height="72" rx="14" fill="#E7F8EF" stroke="#2BA160" stroke-width="1.6" filter="url(#shadow)"/>
  <path d="M540,394 a14,14 0 0 1 14,-14 h412 a14,14 0 0 1 14,14 v28 h-440 z" fill="#2BA160"/>
  <text x="556" y="408" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start">make equiv-prove: proof</text>
  <text x="556" y="438" font-family="Inter,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#1F2937" font-weight="400" text-anchor="start">z3 proves A = B for every state meeting them</text>
</svg>
